# master にプッシュしたら、game/ フォルダを GitHub Pages に公開する。
# 事前に、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく。
name: GitHub Pages に公開

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったときは、先に始まったものを最後まで終わらせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
